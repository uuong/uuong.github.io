<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>WUX IoT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;padding:12px 12px 80px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:12px}
.header h1{font-size:18px;color:#4fc3f7}
.header-right{display:flex;align-items:center;gap:10px}
.conn-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.conn-dot.on{background:#4caf50}.conn-dot.off{background:#f44336}.conn-dot.ing{background:#ff9800;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.refresh-all{background:none;border:none;color:#4fc3f7;font-size:20px;cursor:pointer;padding:6px}
.refresh-all:active{transform:rotate(180deg);transition:transform .3s}

.devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dev-card{background:#16213e;border-radius:12px;padding:14px;text-align:center;position:relative;transition:all .2s}
.dev-card.on{box-shadow:0 0 15px rgba(76,175,80,.3);border:1px solid #4caf50}
.dev-card.off{border:1px solid #333}
.dev-card.unknown{border:1px solid #555}
.dev-card .icon{font-size:32px;margin-bottom:6px}
.dev-card .name{font-size:12px;color:#aaa;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev-card .state{font-size:11px;margin-bottom:10px}
.dev-card .state.on{color:#4caf50}.dev-card .state.off{color:#888}.dev-card .state.unknown{color:#555}
.dev-card .actions{display:flex;gap:6px;justify-content:center}
.dev-card .actions button{padding:8px 14px;border:none;border-radius:6px;font-size:11px;cursor:pointer;color:#fff;transition:all .15s}
.dev-card .actions button:active{transform:scale(.9)}
.dev-card .actions .a-on{background:#4caf50}
.dev-card .actions .a-off{background:#f44336}
.dev-card .actions .a-refresh{background:#555;font-size:13px}
.dev-card .del-btn{position:absolute;top:5px;right:7px;background:none;border:none;color:#555;font-size:13px;cursor:pointer;display:none}
.dev-card:hover .del-btn{display:block}

.add-card{background:#0f3460;border:2px dashed #333;border-radius:12px;padding:14px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:130px}
.add-card:hover{border-color:#4fc3f7}
.add-card span{font-size:28px;color:#555}

/* 底部栏 */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#16213e;border-top:1px solid #333;padding:6px 16px;display:flex;justify-content:space-around}
.bottom-bar button{background:none;border:none;color:#888;font-size:10px;cursor:pointer;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom-bar button.active{color:#4fc3f7}
.bottom-bar button span{font-size:18px}

/* 面板 */
.panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;z-index:100;padding:16px;overflow-y:auto;padding-bottom:80px}
.panel.show{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #333}
.panel-header h2{font-size:15px;color:#4fc3f7}
.close-btn{background:none;border:none;color:#aaa;font-size:22px;cursor:pointer;padding:4px 8px}

.card{background:#16213e;border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{font-size:12px;color:#4fc3f7;margin-bottom:8px}
.btn{display:inline-block;padding:9px 16px;border:none;border-radius:7px;font-size:12px;cursor:pointer;margin:3px;color:#fff;transition:all .15s}
.btn:active{transform:scale(.95)}
.btn-on{background:#4caf50}.btn-off{background:#f44336}.btn-toggle{background:#ff9800}
.btn-blue{background:#2196f3}.btn-gray{background:#555}.btn-sm{padding:6px 11px;font-size:11px}
input,select{width:100%;padding:8px;margin:4px 0;border-radius:6px;border:1px solid #333;background:#0f3460;color:#eee;font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.timer-item{display:flex;justify-content:space-between;align-items:center;padding:7px;background:#0f3460;border-radius:6px;margin:4px 0;font-size:11px}
.log{font-family:monospace;font-size:10px;background:#0a0a1a;border-radius:6px;padding:8px;max-height:180px;overflow-y:auto;margin-top:6px}
.log p{margin:1px 0;color:#666}.log p.in{color:#4fc3f7}.log p.out{color:#a5d6a7}.log p.err{color:#ef5350}
.form-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.form-row label{font-size:11px;color:#aaa;min-width:50px}
.form-row input{flex:1}
.countdown-display{font-size:13px;font-weight:bold;color:#ff9800;margin:6px 0}

/* 弹窗 */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:#16213e;border-radius:12px;padding:20px;width:100%;max-width:320px}
.modal-content h3{margin-bottom:14px;color:#4fc3f7;font-size:14px}

/* 提示 */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#eee;padding:8px 16px;border-radius:6px;font-size:12px;z-index:300;display:none}
.toast.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- 主页 -->
<div id="homePage">
<div class="header">
<h1>🏠 WUX IoT</h1>
<div class="header-right">
<button class="refresh-all" onclick="refreshAll()" title="刷新所有">🔄</button>
<span class="conn-dot off" id="connDot"></span>
<span id="connText" style="font-size:11px;color:#888">未连接</span>
</div>
</div>
<div class="devices" id="deviceGrid"></div>
</div>

<!-- 设备详情面板 -->
<div class="panel" id="devicePanel">
<div class="panel-header">
<h2 id="panelTitle">设备</h2>
<button class="close-btn" onclick="closePanel()">✕</button>
</div>

<div class="card">
<h3>⚡ 控制</h3>
<div class="row">
<button class="btn btn-on" onclick="sendTo('d:on')">开启</button>
<button class="btn btn-off" onclick="sendTo('d:off')">关闭</button>
<button class="btn btn-toggle" onclick="sendTo('d:toggle')">切换</button>
</div>
<p id="panelState" style="font-size:12px;color:#888;margin-top:8px"></p>
</div>

<div class="card">
<h3>⏱ 倒计时</h3>
<div class="row">
<input type="number" id="cdMin" placeholder="分钟" style="width:70px">
<select id="cdAct" style="width:60px"><option value="0">关</option><option value="1">开</option></select>
<button class="btn btn-sm btn-blue" onclick="startCD()">开始</button>
<button class="btn btn-sm btn-gray" onclick="sendTo('t:cc')">取消</button>
</div>
<div class="countdown-display" id="cdDisplay"></div>
</div>

<div class="card">
<h3>🕐 定时</h3>
<div class="row">
<input type="time" id="tmTime" style="width:100px">
<select id="tmAct" style="width:50px"><option value="1">开</option><option value="0">关</option></select>
<select id="tmRep" style="width:70px">
<option value="1">每天</option><option value="0">单次</option><option value="2">工作日</option><option value="3">周末</option>
</select>
<button class="btn btn-sm btn-blue" onclick="addTimer()">添加</button>
</div>
<div id="timersList"></div>
<div class="row">
<button class="btn btn-sm btn-gray" onclick="sendTo('t:c')">清除</button>
<button class="btn btn-sm btn-blue" onclick="sendTo('t:q')">刷新</button>
<button class="btn btn-sm btn-blue" onclick="syncTime()">同步时间</button>
</div>
</div>

<div class="card">
<h3>📝 自定义命令</h3>
<div class="row">
<input type="text" id="customCmd" placeholder="d:on / t:a:8:30:1:1:127">
<button class="btn btn-sm btn-blue" onclick="sendCustom()">发送</button>
</div>
</div>

<div class="card">
<h3>📋 日志</h3>
<div class="row">
<button class="btn btn-sm btn-gray" onclick="clearLog()">清除</button>
<button class="btn btn-sm btn-blue" onclick="sendTo('status')">查询状态</button>
</div>
<div class="log" id="log"></div>
</div>
</div>

<!-- 设置面板 -->
<div class="panel" id="settingsPanel">
<div class="panel-header">
<h2>⚙️ 设置</h2>
<button class="close-btn" onclick="closeSettings()">✕</button>
</div>
<div class="card">
<h3>MQTT 连接</h3>
<div class="form-row"><label>Broker</label><input type="text" id="broker" value="broker.emqx.io"></div>
<div class="form-row"><label>密钥</label><input type="text" id="secretKey" placeholder="HMAC密钥（可选）"></div>
<div class="row">
<button class="btn btn-blue" onclick="reconnect()">重新连接</button>
<button class="btn btn-gray" onclick="disconnectMQTT()">断开</button>
</div>
</div>
<div class="card">
<h3>分享链接</h3>
<p style="font-size:11px;color:#666;margin-bottom:6px">其他人打开链接可快速添加设备</p>
<input type="text" id="shareLink" readonly style="font-size:10px">
<button class="btn btn-sm btn-blue" onclick="copyShareLink()">复制</button>
</div>
</div>

<!-- 添加设备弹窗 -->
<div class="modal" id="addModal">
<div class="modal-content">
<h3>添加设备</h3>
<div class="form-row"><label>设备ID</label><input type="text" id="newDeviceId" placeholder="xx-xx-xx"></div>
<div class="form-row"><label>名称</label><input type="text" id="newDeviceName" placeholder="客厅灯（可选）"></div>
<div class="form-row"><label>图标</label>
<select id="newDeviceIcon">
<option value="💡">💡 灯</option><option value="🔌">🔌 插座</option><option value="❄️">❄️ 空调</option>
<option value="🚪">🚪 门</option><option value="💨">💨 风扇</option><option value="📺">📺 电视</option>
<option value="🔔">🔔 门铃</option><option value="⚡">⚡ 设备</option>
</select></div>
<div class="row">
<button class="btn btn-blue" onclick="confirmAdd()">添加</button>
<button class="btn btn-gray" onclick="closeAddModal()">取消</button>
</div>
</div>
</div>

<!-- 底部导航 -->
<div class="bottom-bar">
<button class="active" id="tabHome" onclick="showHome()"><span>🏠</span>设备</button>
<button id="tabSettings" onclick="showSettings()"><span>⚙️</span>设置</button>
</div>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
// ===== 数据 =====
let client = null;
let devices = [];
let currentDevice = null;

// ===== 初始化 =====
window.onload = () => {
    loadData();
    parseURL();
    renderDevices();
    autoConnect();
};

// ===== URL =====
function parseURL() {
    const p = new URLSearchParams(location.search);
    if(p.has('device')) {
        const id = p.get('device');
        const name = p.get('name') || id;
        const icon = p.get('icon') || '💡';
        if(!devices.find(d => d.id === id)) {
            devices.push({id, name: decodeURIComponent(name), icon: decodeURIComponent(icon), state: 'unknown'});
            saveData();
        }
    }
    if(p.has('key')) document.getElementById('secretKey').value = p.get('key');
    if(p.has('broker')) document.getElementById('broker').value = p.get('broker');
    if(p.toString()) { saveData(); history.replaceState(null, '', location.pathname); }
}

// ===== 存储 =====
function saveData() {
    localStorage.setItem('wux_devices', JSON.stringify(devices));
    localStorage.setItem('wux_broker', document.getElementById('broker').value);
    localStorage.setItem('wux_key', document.getElementById('secretKey').value);
}
function loadData() {
    try { devices = JSON.parse(localStorage.getItem('wux_devices') || '[]'); } catch(e) { devices=[]; }
    document.getElementById('broker').value = localStorage.getItem('wux_broker') || 'broker.emqx.io';
    document.getElementById('secretKey').value = localStorage.getItem('wux_key') || '';
}

// ===== MQTT =====
function autoConnect() {
    const broker = document.getElementById('broker').value || 'broker.emqx.io';
    setConn('ing', '连接中');
    client = mqtt.connect('wss://' + broker + ':8084/mqtt', {
        clientId: 'wux_' + Math.random().toString(16).slice(2,8),
        clean: true, connectTimeout: 5000, reconnectPeriod: 5000
    });
    client.on('connect', () => {
        setConn('on', '已连接');
        subscribeAll();
        // 连接后自动刷新所有设备状态
        setTimeout(refreshAll, 500);
    });
    client.on('message', (t, payload) => onMessage(t, payload.toString()));
    client.on('error', () => setConn('off', '错误'));
    client.on('close', () => setConn('off', '已断开'));
    client.on('reconnect', () => setConn('ing', '重连中'));
}

function subscribeAll() {
    if(!client || !client.connected) return;
    devices.forEach(d => {
        client.subscribe('wux/device/' + d.id + '/state');
        client.subscribe('wux/device/' + d.id + '/status');
    });
}

function reconnect() {
    if(client) client.end();
    saveData();
    autoConnect();
}
function disconnectMQTT() {
    if(client) { client.end(); client = null; }
    setConn('off', '已断开');
}
function setConn(s, txt) {
    document.getElementById('connDot').className = 'conn-dot ' + s;
    document.getElementById('connText').textContent = txt;
}

// ===== 刷新所有设备状态 =====
function refreshAll() {
    if(!client || !client.connected) { toast('未连接'); return; }
    devices.forEach((d, i) => {
        setTimeout(() => sendCmd(d.id, 'status'), i * 100);
    });
    toast('正在刷新...');
}

// 刷新单个设备
function refreshDevice(id) {
    if(!client || !client.connected) return;
    sendCmd(id, 'status');
}

// ===== 消息处理 =====
function onMessage(t, msg) {
    const parts = t.split('/');
    if(parts.length < 4) return;
    const devId = parts[2];
    const type = parts[3];
    const dev = devices.find(d => d.id === devId);
    if(!dev) return;

    if(type === 'state') {
        dev.state = (msg === 'on' || msg === '1') ? 'on' : 'off';
        renderDevices();
    }
    if(type === 'status') {
        const m = msg.match(/relay:(on|off)/);
        if(m) { dev.state = m[1]; renderDevices(); }
        if(currentDevice && currentDevice.id === devId) {
            addLog('← ' + msg, 'in');
            parseTimerStatus(msg);
            document.getElementById('panelState').textContent = '状态: ' + (dev.state === 'on' ? '🟢 已开启' : '🔴 已关闭');
        }
    }
}

// ===== 发送 =====
async function sendCmd(deviceId, cmd) {
    if(!client || !client.connected) return;
    const topic = 'wux/device/' + deviceId + '/command';
    const key = document.getElementById('secretKey').value.trim();
    let msg = cmd;
    if(key) {
        const ts = Math.floor(Date.now() / 1000);
        const payload = cmd + ':' + ts;
        const sig = await hmac256(key, payload);
        msg = payload + ':' + sig;
    }
    client.publish(topic, msg);
}

async function sendTo(cmd) {
    if(!currentDevice) return;
    await sendCmd(currentDevice.id, cmd);
    addLog('→ ' + cmd, 'out');
}

async function hmac256(key, data) {
    const enc = new TextEncoder();
    const k = await crypto.subtle.importKey('raw', enc.encode(key), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', k, enc.encode(data));
    return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,32);
}

// ===== 设备渲染 =====
function renderDevices() {
    const grid = document.getElementById('deviceGrid');
    grid.innerHTML = '';
    devices.forEach(d => {
        const card = document.createElement('div');
        card.className = 'dev-card ' + (d.state || 'unknown');
        card.innerHTML = `
            <button class="del-btn" onclick="event.stopPropagation();removeDevice('${d.id}')">✕</button>
            <div class="icon">${d.icon}</div>
            <div class="name">${d.name || d.id}</div>
            <div class="state ${d.state || 'unknown'}">${d.state === 'on' ? '已开启' : d.state === 'off' ? '已关闭' : '未知'}</div>
            <div class="actions">
                <button class="a-on" onclick="event.stopPropagation();sendCmd('${d.id}','d:on')">开</button>
                <button class="a-off" onclick="event.stopPropagation();sendCmd('${d.id}','d:off')">关</button>
                <button class="a-refresh" onclick="event.stopPropagation();refreshDevice('${d.id}')">↻</button>
            </div>
        `;
        // 长按进入高级面板
        let pressTimer = null;
        let pressed = false;

        const startPress = (e) => {
            pressed = false;
            pressTimer = setTimeout(() => { pressed = true; openPanel(d); }, 600);
        };
        const endPress = (e) => {
            clearTimeout(pressTimer);
            // 短按刷新状态（如果不是点到按钮上）
            if(!pressed && e.target === card || e.target.classList.contains('icon') ||
               e.target.classList.contains('name') || e.target.classList.contains('state')) {
                refreshDevice(d.id);
                toast(d.name + ' 刷新中');
            }
        };
        const cancelPress = () => { clearTimeout(pressTimer); };

        card.addEventListener('mousedown', startPress);
        card.addEventListener('mouseup', endPress);
        card.addEventListener('mouseleave', cancelPress);
        card.addEventListener('touchstart', startPress, {passive:true});
        card.addEventListener('touchend', endPress);
        card.addEventListener('touchcancel', cancelPress);
        card.addEventListener('contextmenu', e => e.preventDefault());

        grid.appendChild(card);
    });
    // 添加按钮
    const add = document.createElement('div');
    add.className = 'add-card';
    add.innerHTML = '<span>＋</span>';
    add.onclick = openAddModal;
    grid.appendChild(add);
}

// ===== 设备管理 =====
function openAddModal() {
    document.getElementById('addModal').classList.add('show');
    document.getElementById('newDeviceId').value = '';
    document.getElementById('newDeviceName').value = '';
}
function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }

function confirmAdd() {
    const id = document.getElementById('newDeviceId').value.trim();
    if(!id) { toast('请输入设备ID'); return; }
    const name = document.getElementById('newDeviceName').value.trim() || id;
    const icon = document.getElementById('newDeviceIcon').value;
    if(devices.find(d => d.id === id)) { toast('设备已存在'); return; }
    devices.push({id, name, icon, state: 'unknown'});
    saveData();
    renderDevices();
    closeAddModal();
    if(client && client.connected) {
        client.subscribe('wux/device/' + id + '/state');
        client.subscribe('wux/device/' + id + '/status');
        setTimeout(() => refreshDevice(id), 300);
    }
    toast('已添加 ' + name);
}

function removeDevice(id) {
    if(!confirm('删除此设备？')) return;
    devices = devices.filter(d => d.id !== id);
    saveData();
    renderDevices();
}

// ===== 详情面板 =====
function openPanel(dev) {
    currentDevice = dev;
    document.getElementById('panelTitle').textContent = dev.icon + ' ' + (dev.name || dev.id);
    document.getElementById('panelState').textContent = '状态: ' + (dev.state === 'on' ? '🟢 已开启' : dev.state === 'off' ? '🔴 已关闭' : '未知');
    document.getElementById('devicePanel').classList.add('show');
    document.getElementById('log').innerHTML = '';
    document.getElementById('timersList').innerHTML = '';
    document.getElementById('cdDisplay').textContent = '';
    sendTo('t:q');
}
function closePanel() {
    document.getElementById('devicePanel').classList.remove('show');
    currentDevice = null;
}

// ===== 定时功能 =====
function startCD() {
    const min = parseInt(document.getElementById('cdMin').value) || 0;
    if(min <= 0) { toast('请输入分钟'); return; }
    sendTo('t:cd:' + (min*60) + ':' + document.getElementById('cdAct').value);
}

function addTimer() {
    const t = document.getElementById('tmTime').value;
    if(!t) { toast('请选择时间'); return; }
    const [h,m] = t.split(':');
    sendTo('t:a:'+parseInt(h)+':'+parseInt(m)+':'+document.getElementById('tmAct').value+
        ':'+document.getElementById('tmRep').value+':127');
    setTimeout(() => sendTo('t:q'), 500);
}

function syncTime() { sendTo('t:s:' + Math.floor(Date.now()/1000)); toast('已同步'); }
function sendCustom() { const c = document.getElementById('customCmd').value.trim(); if(c) sendTo(c); }

function parseTimerStatus(msg) {
    const list = document.getElementById('timersList'); list.innerHTML = '';
    const cd = document.getElementById('cdDisplay'); cd.textContent = '';
    const acts=['关','开','切换'], reps=['单次','每天','工作日','周末'];
    msg.split('|').forEach(item => {
        let m = item.match(/^t(\d+):(\d+):(\d+):(\d+):(\d+):(\d+)/);
        if(m) {
            const div = document.createElement('div'); div.className = 'timer-item';
            div.innerHTML = '<span>#'+m[1]+' '+m[2].padStart(2,'0')+':'+m[3].padStart(2,'0')+
                ' '+(acts[m[4]]||'?')+' '+(reps[m[5]]||'?')+'</span>'+
                '<button class="btn btn-sm btn-off" onclick="sendTo(\'t:d:'+m[1]+'\');setTimeout(()=>sendTo(\'t:q\'),500)">删</button>';
            list.appendChild(div);
        }
        let c = item.match(/^cd(\d+):(-?\d+):(\d+)/);
        if(c && parseInt(c[2])>0) {
            let s=parseInt(c[2]);
            cd.textContent='⏱ '+Math.floor(s/60)+'分'+(s%60)+'秒后'+(c[3]==='0'?'关':'开');
        }
    });
}

// ===== 日志 =====
function addLog(msg, cls) {
    const el = document.getElementById('log');
    const p = document.createElement('p'); p.className = cls||'';
    p.textContent = new Date().toLocaleTimeString()+' '+msg;
    el.appendChild(p); el.scrollTop = el.scrollHeight;
    while(el.children.length > 50) el.removeChild(el.firstChild);
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

// ===== 导航 =====
function showHome() {
    closePanel(); closeSettings();
    document.getElementById('tabHome').classList.add('active');
    document.getElementById('tabSettings').classList.remove('active');
}
function showSettings() {
    closePanel();
    document.getElementById('settingsPanel').classList.add('show');
    document.getElementById('tabHome').classList.remove('active');
    document.getElementById('tabSettings').classList.add('active');
    generateShareLink();
}
function closeSettings() { document.getElementById('settingsPanel').classList.remove('show'); }

// ===== 分享 =====
function generateShareLink() {
    const base = location.origin + location.pathname;
    const broker = document.getElementById('broker').value;
    const key = document.getElementById('secretKey').value;
    let p = [];
    if(broker && broker !== 'broker.emqx.io') p.push('broker='+encodeURIComponent(broker));
    if(key) p.push('key='+encodeURIComponent(key));
    if(devices.length === 1) p.push('device='+encodeURIComponent(devices[0].id)+'&name='+encodeURIComponent(devices[0].name));
    document.getElementById('shareLink').value = base + (p.length ? '?'+p.join('&') : '');
}
function copyShareLink() {
    navigator.clipboard.writeText(document.getElementById('shareLink').value).then(() => toast('已复制'));
}

// ===== Toast =====
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
}

// ===== SW =====
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
